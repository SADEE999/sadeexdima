name: SADEE X DIMA - Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy SADEE X DIMA
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify Website
        shell: bash
        run: |
          set -e

          echo "Checking website..."

          test -f index.html
          test -f styles.css || true
          test -f app.js || true
          test -d admin || true

          echo "✅ index.html found"
          echo "✅ Website files verified"

      - name: Upload Website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
