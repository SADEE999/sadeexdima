name: SADEE SOLUTIONS PRO MAX - Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sadee-solutions-pro-max
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy PRO MAX
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # FIND ZIP
      # --------------------------------------------------
      - name: Find PRO MAX ZIP
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo " SEARCHING FOR WEBSITE ZIP"
          echo "===================================="

          find . -maxdepth 3 -type f | sort

          ZIP_FILE=$(find . \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ No ZIP file found."
            exit 1
          fi

          echo "✅ ZIP FOUND:"
          echo "$ZIP_FILE"

          cp "$ZIP_FILE" website.zip

          ls -lh website.zip

      # --------------------------------------------------
      # TEST ZIP
      # --------------------------------------------------
      - name: Validate ZIP
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo " VALIDATING ZIP"
          echo "===================================="

          unzip -t website.zip

          echo "✅ ZIP validation successful"

      # --------------------------------------------------
      # EXTRACT
      # --------------------------------------------------
      - name: Extract PRO MAX Website
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o website.zip -d extracted

          echo "✅ Website extracted"

      # --------------------------------------------------
      # FIND INDEX
      # --------------------------------------------------
      - name: Detect Website Root
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo " SEARCHING FOR INDEX.HTML"
          echo "===================================="

          INDEX_FILE=$(find extracted \
            -type f \
            -iname "index.html" \
            | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "❌ index.html was not found."

            echo ""
            echo "===== EXTRACTED FILES ====="

            find extracted \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1
          fi

          echo "✅ index.html found:"
          echo "$INDEX_FILE"

          WEBSITE_ROOT=$(dirname "$INDEX_FILE")

          echo ""
          echo "Website root:"
          echo "$WEBSITE_ROOT"

          rm -rf dist
          mkdir -p dist

          # Preserve the uploaded website files exactly.
          cp -a "$WEBSITE_ROOT"/. dist/

          echo "✅ Website copied to dist"

      # --------------------------------------------------
      # VERIFY CUSTOMER SITE
      # --------------------------------------------------
      - name: Verify Customer Website
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo " CUSTOMER WEBSITE CHECK"
          echo "===================================="

          test -f dist/index.html

          echo "✅ index.html"

          if [ -f dist/styles.css ]; then
            echo "✅ styles.css"
          fi

          if [ -f dist/app.js ]; then
            echo "✅ app.js"
          fi

          if [ -f dist/config.js ]; then
            echo "✅ config.js"
          fi

          if [ -f dist/supabase.sql ]; then
            echo "✅ supabase.sql"
          fi

      # --------------------------------------------------
      # VERIFY ADMIN
      # --------------------------------------------------
      - name: Verify Admin Panel
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo " ADMIN PANEL CHECK"
          echo "===================================="

          if [ ! -d "dist/admin" ]; then
            echo "❌ admin folder missing"
            exit 1
          fi

          echo "✅ admin folder"

          if [ ! -f "dist/admin/index.html" ]; then
            echo "❌ admin/index.html missing"
            exit 1
          fi

          echo "✅ admin/index.html"

          if [ -f "dist/admin/admin.js" ]; then
            echo "✅ admin/admin.js"
          fi

          if [ -f "dist/admin/admin.css" ]; then
            echo "✅ admin/admin.css"
          fi

      # --------------------------------------------------
      # CHECK MEDIA
      # --------------------------------------------------
      - name: Verify Images & Videos
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo " MEDIA CHECK"
          echo "===================================="

          echo ""
          echo "Images:"

          find dist \
            -type f \
            \( \
              -iname "*.png" \
              -o -iname "*.jpg" \
              -o -iname "*.jpeg" \
              -o -iname "*.webp" \
              -o -iname "*.gif" \
              -o -iname "*.svg" \
            \) \
            | sort || true

          echo ""
          echo "Videos:"

          find dist \
            -type f \
            \( \
              -iname "*.mp4" \
              -o -iname "*.webm" \
              -o -iname "*.mov" \
              -o -iname "*.m4v" \
            \) \
            | sort || true

      # --------------------------------------------------
      # CONFIGURE PAGES
      # --------------------------------------------------
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # --------------------------------------------------
      # UPLOAD ARTIFACT
      # --------------------------------------------------
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # --------------------------------------------------
      # DEPLOY
      # --------------------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # --------------------------------------------------
      # FINAL STATUS
      # --------------------------------------------------
      - name: Deployment Complete
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "     SADEE SOLUTIONS PRO MAX LIVE"
          echo "=============================================="
          echo ""
          echo "🌐 CUSTOMER WEBSITE:"
          echo "https://sadee999.github.io/SADEE_SOLUTIONS_STORE/"
          echo ""
          echo "🔐 ADMIN PANEL:"
          echo "https://sadee999.github.io/SADEE_SOLUTIONS_STORE/admin/"
          echo ""
          echo "=============================================="
