name: SADEE X DIMA - Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sadeexdima-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Website
        run: |
          echo "Checking files..."

          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          echo "OK: index.html"

          if [ -d "admin" ]; then
            echo "OK: admin folder"
          fi

          if [ -d "assets" ]; then
            echo "OK: assets folder"
          fi

          echo "Website check complete."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
